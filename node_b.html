<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iTantra - Node B: Command Center Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020408;
            --panel-bg: rgba(10, 15, 25, 0.85);
            --panel-border: rgba(59, 130, 246, 0.3);
            --accent-blue: #3b82f6;
            --accent-blue-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body { 
            background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; 
            padding: 40px 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: auto; box-sizing: border-box;
            background-image: radial-gradient(circle at 50% 0%, #0c203a 0%, var(--bg-color) 70%), linear-gradient(rgba(59, 130, 246, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px;
        }
        .console-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 30px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 20px; }
        h2 { font-family: 'JetBrains Mono', monospace; color: var(--accent-blue); margin: 0; font-size: 18px; text-shadow: 0 0 10px var(--accent-blue-glow); }
        .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.4); padding: 5px 12px; border-radius: 20px; color: var(--accent-blue); }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .info-box { background: #020407; border: 1px solid rgba(255,255,255,0.08); padding: 10px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; }
        .info-box span { font-size: 10px; color: var(--text-muted); display: block; text-transform: uppercase; }
        .info-box b { font-size: 13px; color: #60a5fa; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 6px; }
        select, input, textarea { width: 100%; background: #020407; color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); padding: 12px 16px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; box-sizing: border-box; margin-bottom: 15px; }
        input[type="range"] { accent-color: var(--accent-blue); cursor: pointer; padding: 0; }
        button { width: 100%; border: none; padding: 13px; font-weight: 600; cursor: pointer; border-radius: 10px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .btn-blue { background: var(--accent-blue); color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .metrics-card { background: #020407; border: 1px solid rgba(59, 130, 246, 0.3); padding: 14px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-bottom: 15px; }
        .metrics-card p { margin: 4px 0; color: var(--text-muted); }
        .metrics-card b { color: #60a5fa; }
        .log-box { background: #020407; border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); max-height: 120px; overflow-y: auto; }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); animation: pulse 1.5s infinite; display: inline-block; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body>
    <div class="console-container">
        <div class="panel" style="padding: 20px 30px;">
            <div class="header-flex" style="margin:0; border:none; padding:0;">
                <div>
                    <h2 style="font-size: 15px; color: var(--text-main);">ISRO SIH26173: Command Center Gateway</h2>
                    <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted);">Real-Time Neural Codec Receiver & Telemetry Hub</p>
                </div>
                <div class="badge"><span class="pulse"></span> NODE B ACTIVE</div>
            </div>
        </div>

        <div class="panel">
            <h2><span>📻 Command Center Receiver & Reply Hub</span></h2>
            
            <div class="info-grid">
                <div class="info-box"><span>Link Status</span><b>Independent Tuning</b></div>
                <div class="info-box"><span>Packet Latency</span><b>&lt; 120ms</b></div>
                <div class="info-box"><span>Token Protocol</span><b>UTF-8 Phonetic</b></div>
            </div>

            <label>Node B Receiver Tuning Frequency: <span id="freq-display" style="color:#60a5fa; font-weight:bold;">1420.0</span> MHz</label>
            <input type="range" id="freq-slider" min="1400.0" max="1450.0" step="0.5" value="1420.0" oninput="updateFrequency(this.value)">

            <label style="margin-top: 15px;">Operation Language Profile</label>
            <select id="lang-selector">
                <option value="hi-IN">🇮🇳 Hindi (हिन्दी)</option>
                <option value="ta-IN">🇮🇳 Tamil (தமிழ்)</option>
                <option value="te-IN">🇮🇳 Telugu (తెలుగు)</option>
                <option value="mr-IN">🇮🇳 Marathi (मराठी)</option>
                <option value="en-IN" selected>🇬🇧 English (India)</option>
            </select>

            <label style="margin-top: 15px;">Decoded Field Payload Stream (Incoming)</label>
            <textarea id="rx-text" rows="3" disabled style="color: var(--text-muted);">Awaiting transmission packets...</textarea>

            <label>Command Voice Input (Reply)</label>
            <button class="btn-blue" onclick="startListening()">🎙️ Record Command Voice via Web Speech API</button>
            <div id="reply-mic-status" style="font-size: 11.5px; font-family: 'JetBrains Mono'; color: #60a5fa; margin-bottom: 12px;"></div>

            <label>Instruction Text Payload</label>
            <input type="text" id="reply-input" placeholder="Type instructions for field officer...">

            <button class="btn-blue" onclick="sendReply()">📡 Transmit Reply to Field</button>
            <div id="reply-metrics"></div>

            <label>📜 Command Center Activity & RX Log</label>
            <div id="packet-log" class="log-box">
                [00:00:01] Command Gateway online. Independent tuning active.<br>
            </div>
        </div>
    </div>

    <script>
        function logMessage(text) {
            const logBox = document.getElementById('packet-log');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<br>[${time}] ${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateFrequency(val) {
            document.getElementById('freq-display').innerText = val;
            fetch('/api/set-freq-b', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ frequency: val })
            });
        }

        setInterval(() => {
            fetch('/api/poll-field')
            .then(res => res.json())
            .then(data => {
                const rxBox = document.getElementById('rx-text');
                if(data.status === "out_of_tune") {
                    rxBox.value = "Awaiting transmission packets...";
                } else {
                    if(rxBox.value !== data.text) {
                        rxBox.value = data.text;
                        logMessage(`Successfully locked & decoded packet on frequency ${data.freq} MHz: "${data.text}"`);
                        playTTS(data.text);
                    }
                }
            });
        }, 2000);

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Use Google Chrome."); return; }
            const selectedLang = document.getElementById('lang-selector').value;
            const recognition = new SpeechRecognition();
            recognition.lang = selectedLang;
            recognition.interimResults = false;
            document.getElementById('reply-mic-status').innerText = "🔴 Listening to command microphone...";
            logMessage("Command microphone activated.");
            recognition.onresult = (e) => {
                document.getElementById('reply-input').value = e.results[0][0].transcript;
                document.getElementById('reply-mic-status').innerText = "✅ Command speech tokenized.";
                logMessage("Command reply text tokenized successfully.");
            };
            recognition.start();
        }

        function sendReply() {
            const replyMessage = document.getElementById('reply-input').value;
            const currentFreq = document.getElementById('freq-display').innerText;
            if (!replyMessage) { alert("Enter instructions first!"); return; }
            logMessage(`Broadcasting reply on ${currentFreq} MHz: "${replyMessage}"`);
            fetch('/api/reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: replyMessage, freq: currentFreq })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('reply-metrics').innerHTML = `
                    <div class="metrics-card">
                        <p>Frequency Tuned: <b>${currentFreq} MHz</b> | Dispatched Reply: <b>${data.payload}</b></p>
                    </div>
                `;
                logMessage(`Reply successfully beamed out on ${currentFreq} MHz.`);
            });
        }

        function playTTS(text) {
            const synth = window.speechSynthesis;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = document.getElementById('lang-selector').value;
            synth.speak(utter);
        }
    </script>
</body>
</html>
